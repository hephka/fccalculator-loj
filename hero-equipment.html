const STORAGE_KEY = "resource-calc-heroequipment-state-v1";
const SCHEMA_VERSION = 5;
const RES_ACCENT = {

// One entry per rarity tier, where a tier's cost is what it takes to LEAVE
// that tier and arrive at the next one (confirmed in-game: Epic->Legendary
// costs 200 Magnets, which is the amount the source table lists under the
// EPIC heading — not the 400 listed under LEGENDARY, which actually belongs
// to the Legendary->Legendary T1 climb). So every tier's own listed cost is
// shifted one slot forward from its heading: "Common" pays for entering
// Uncommon, "Uncommon" for entering Rare, ... "Legendary" for entering
// Legendary T1 (on top of that promotion's existing Mastery Lv10 gate).
// Common itself is free — hero equipment starts at Common rarity the moment
// it exists, nothing is ever spent to "unlock" it.
// Common's shifted total (attached to "uncommon" below) includes an
// estimated ~970 for the untracked Level 0->10 portion (only 11-15 and
// 16-20 were given) — fit from a geometric growth curve across the 6 known
// Common/Uncommon brackets (within 5% on every point) and extrapolated
// backward. Flagged in introNote, not verified.
const EQUIPMENT_TIERS = [
  { key:"common",       parts:0 },
  { key:"uncommon",     parts:2620 /* incl. ~970 estimated */, magnet:20, estimated:true },
  { key:"rare",         parts:6980,   magnet:40 },
  { key:"epic",         parts:19220,  magnet:120 },
  { key:"legendary",    parts:41020,  magnet:200 },
  { key:"legendary_t1", parts:77000,  magnet:400,  masteryReq:10 },
  { key:"legendary_t2", parts:117000, magnet:600,  coil:20,  masteryReq:11 },
  { key:"exotic",       parts:157000, magnet:1000, coil:40,  masteryReq:12 },
  { key:"exotic_t1",    parts:197000, magnet:1000, coil:60,  masteryReq:13 },
  { key:"exotic_t2",    parts:258000, magnet:2000, coil:80,  masteryReq:14 },
  { key:"exotic_t3",    parts:338200, magnet:2000, coil:100, masteryReq:15 },
];

// Each tier transition bundles two separate in-game actions, so it's modelled
// as two levels you can sit between: the Equipment EXP is the ~20 level-ups
// ground out while still in the PREVIOUS tier ("Epic · levels maxed"), and the
// Magnet/Coil is the promotion itself. Splitting them is what lets a piece
// whose levels are already maxed be quoted the promotion alone, instead of
// being re-charged EXP it has already spent. The Mastery gate belongs to the
// promotion only — levelling with EXP is never gated in-game.
function makeEquipmentTrack(troopKey, slotKey){
  const levels = [];
  EQUIPMENT_TIERS.forEach((tier,i)=>{
    if(i === 0){
      levels.push({ id:tier.key, cost:zeroResources(), requires:[] });
      return;
    }
    const grind = zeroResources();
    grind.EquipmentParts = tier.parts || 0;
    levels.push({
      id:`${EQUIPMENT_TIERS[i-1].key}_s1`, cost:grind, requires:[],
      estimated:!!tier.estimated, targetCheckpoint:false, labelSuffixKey:"levelsMaxed"
    });
    const promotion = zeroResources();
    promotion.Magnet = tier.magnet || 0;
    promotion.PotentialCoil = tier.coil || 0;
    const requires = tier.masteryReq ? [{trackId:`mastery_${troopKey}_${slotKey}`, levelId:String(tier.masteryReq)}] : [];
    levels.push({ id:tier.key, cost:promotion, requires });
  });
  return {
    id:`equip_${troopKey}_${slotKey}`, category:"Equipment",
    groupKey:troopKey, groupLabelKey:"troop_"+troopKey,
    nameParts:["troop_"+troopKey, "equip_"+slotKey],
    levelStyle:"keyed", levelKeyPrefix:"equiptier_",
    pairedTrackId:`mastery_${troopKey}_${slotKey}`, pairedLabelKey:"pairedMasteryLabel",
    // "common" (index 0, free) is the real baseline — no separate
    // "not started" placeholder before it.
    currentLevelIndex:0, targetLevelIndex:0, levels
  };
}

// Levels 0->20, one by one (source table gives per-level Precision Equipment
// cost; Magnet is only spent from Level 10 onward). Kept exactly as given,
// including its minor non-linear jumps — they're small and at low levels.
// Mastery never requires anything from the Level side — it's freestanding.
const MASTERY_PRECISION = [
  20,40,60,80,100,120,140,160,180,200,
  220,240,260,280,300,320,360,380,400,400,
];
const MASTERY_MAGNET = {10:220,11:200,12:400,13:600,14:800,15:1000,16:1200,17:1400,18:1600,19:1800,20:2000};

function makeMasteryTrack(troopKey, slotKey){
  const levels = [{ id:"0", cost:zeroResources(), requires:[] }];
  MASTERY_PRECISION.forEach((precision,i)=>{
    const lvl = i+1;
    const cost = zeroResources();
    cost.PrecisionEquipment = precision;
    cost.Magnet = MASTERY_MAGNET[lvl] || 0;
    levels.push({ id:String(lvl), cost, requires:[] });
  });
  return {
    id:`mastery_${troopKey}_${slotKey}`, category:"Mastery",
    groupKey:troopKey, groupLabelKey:"troop_"+troopKey,
    nameParts:["troop_"+troopKey, "equip_"+slotKey], levelStyle:"numeric",
    currentLevelIndex:0, targetLevelIndex:0, levels
  };
}

const TROOPS = ["shieldbearer","bomber","shooter"];
const SLOTS = ["gloves","helmet","chest","boots"];

function defaultData(){
  const tracks = [];
  TROOPS.forEach(troop=>{
    SLOTS.forEach(slot=>{
      tracks.push(makeEquipmentTrack(troop, slot));
      tracks.push(makeMasteryTrack(troop, slot));
    });
  });
  return {
    schemaVersion: SCHEMA_VERSION,
    stock: zeroResources(),
    tracks
  };
}

// Schema 4 -> 5 inserted a "· levels maxed" sub-level ahead of every rarity,
// so each Equipment level sits at exactly twice its old index (old "Epic" 3 ->
// new 6). Mastery tracks were not touched. An old level therefore maps onto
// the promotion cran, never onto a "levels maxed" one — the conservative
// reading, since a v4 state never claimed the inner levels were done.
function migrateState(old){
  if(old.schemaVersion !== 4 || !Array.isArray(old.tracks)) return null;
  const fresh = defaultData();
  RESOURCES.forEach(r=>{
    if(typeof (old.stock||{})[r] === "number") fresh.stock[r] = old.stock[r];
  });
  old.tracks.forEach(saved=>{
    const track = fresh.tracks.find(t=>t.id===saved.id);
    if(!track) return;
    const scale = track.category === "Equipment" ? 2 : 1;
    const clamp = v => Math.max(0, Math.min(Number(v)*scale || 0, track.levels.length-1));
    track.currentLevelIndex = clamp(saved.currentLevelIndex);
    track.targetLevelIndex = Math.max(clamp(saved.targetLevelIndex), track.currentLevelIndex);
  });
  return fresh;
}
</script>
