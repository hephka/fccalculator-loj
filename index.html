// Builds the full chain of stage costs for a building, from its earliest known
// tier up through FC8. Each entry in `earlyFC` is the per-stage FC cost for one
// tier transition before AFC exists (30->FC1, FC1->FC2, ... FC4->FC5). `lateAfcFc`
// is the 3 per-stage {afc,fc} costs for FC5->FC6, FC6->FC7, FC7->FC8 (AFC required
// starting at FC5).
function tierChain(earlyFC, lateAfcFc){
  const froms = ["30","FC1","FC2","FC3","FC4","FC5","FC6","FC7"];
  const tos   = ["FC1","FC2","FC3","FC4","FC5","FC6","FC7","FC8"];
  const stages = [...earlyFC.map(fc=>({afc:0,fc})), ...lateAfcFc];
  return stages.map((s,i)=>({from:froms[i], to:tos[i], afc:s.afc, fc:s.fc}));
}

function buildingTrack(id, tiers, gateByWardenOffice){
  const levels = [
    { id:tiers[0].from, cost:{FC:0,AFC:0,Hyperalloy:0}, requires:[] }
  ];
  tiers.forEach(tier=>{
    // To progress beyond a tier, Warden Office must already have reached the next tier.
    const gate = () => gateByWardenOffice ? [{trackId:"warden_office",levelId:tier.to}] : [];
    for(let i=1;i<=4;i++){
      levels.push({ id:`${tier.from}_s${i}`, cost:{FC:tier.fc,AFC:tier.afc,Hyperalloy:0}, requires:gate() });
    }
    levels.push({ id:tier.to, cost:{FC:tier.fc,AFC:tier.afc,Hyperalloy:0}, requires:gate() });
  });
  return { id, category:"Building", nameParts:["building_"+id], currentLevelIndex:0, targetLevelIndex:0, levels };
}

function fclabTrack(id, statKey, hyperCosts, requiresMap){
  const levels = [{ id:"0", cost:{FC:0,AFC:0,Hyperalloy:0}, requires:[] }];
  hyperCosts.forEach((h,i)=>{
    const idx = i+1;
    levels.push({
      id:String(idx),
      cost:{FC:0,AFC:0,Hyperalloy:h},
      requires: (requiresMap && requiresMap[idx]) ? requiresMap[idx] : []
    });
  });
  return { id, statKey, category:"Research", levelStyle:"numeric", currentLevelIndex:0, targetLevelIndex:0, levels };
}

function defaultData(){
  const wardenOffice = buildingTrack("warden_office", tierChain(
    [250,320,490,600,720],
    [{afc:24,fc:360},{afc:36,fc:400},{afc:48,fc:460}]
  ));
  // Warden Office = main building (HQ): moving to a new FC tier requires 2 support buildings
  // to have already reached the previous tier (requirements table). The very first
  // climb (30->FC1) needs Communication Center + Shooter Barracks at Lv.29, which is
  // outside our tracked range (tracks start at 30), so no gate is set for FC1.
  const setRequires = (levelId, reqs) => { wardenOffice.levels.find(l=>l.id===levelId).requires = reqs; };
  setRequires("FC2", [{trackId:"bomber_barrack",levelId:"FC1"},{trackId:"communication_center",levelId:"FC1"}]);
  setRequires("FC3", [{trackId:"shieldbearer_barrack",levelId:"FC2"},{trackId:"communication_center",levelId:"FC2"}]);
  setRequires("FC4", [{trackId:"shooter_barrack",levelId:"FC3"},{trackId:"communication_center",levelId:"FC3"}]);
  setRequires("FC5", [{trackId:"bomber_barrack",levelId:"FC4"},{trackId:"communication_center",levelId:"FC4"}]);
  setRequires("FC6", [{trackId:"shieldbearer_barrack",levelId:"FC5"},{trackId:"communication_center",levelId:"FC5"}]);
  setRequires("FC7", [{trackId:"shooter_barrack",levelId:"FC6"},{trackId:"communication_center",levelId:"FC6"}]);
  setRequires("FC8", [{trackId:"bomber_barrack",levelId:"FC7"},{trackId:"communication_center",levelId:"FC7"}]);

  const buildings = [
    wardenOffice,
    buildingTrack("shieldbearer_barrack", tierChain([130,150,230,250,300], [{afc:10,fc:160},{afc:15,fc:180},{afc:22,fc:210}]), true),
    buildingTrack("bomber_barrack", tierChain([130,150,230,250,300], [{afc:10,fc:160},{afc:15,fc:180},{afc:22,fc:210}]), true),
    buildingTrack("shooter_barrack", tierChain([130,150,230,250,300], [{afc:10,fc:160},{afc:15,fc:180},{afc:22,fc:210}]), true),
    buildingTrack("communication_center", tierChain([50,60,80,110,130], [{afc:5,fc:90},{afc:8,fc:100},{afc:12,fc:110}]), true),
    buildingTrack("command_center", tierChain([50,60,80,110,130], [{afc:5,fc:70},{afc:8,fc:80},{afc:12,fc:90}]), true),
    buildingTrack("medical_station", tierChain([50,60,80,110,130], [{afc:5,fc:70},{afc:8,fc:80},{afc:12,fc:90}]), true),
  ];

  // FC Lab itself is considered maxed out: no track or requirement for it.
  // Each troop type (Shooter, Bomber, Shieldbearer) has its own independent research
  // tree leading to T11: internal requirements only concern that type.
  function fcLabTree(troopKey){
    const expedition = fclabTrack(`fclab_${troopKey}_expedition`, "expedition",
      [30,50,80,130,220]
    );
    const mkCombat = (id,statKey) => fclabTrack(id,statKey,
      [80,100,140,180,240,300,380,480,600,800],
      { 5:[{trackId:`fclab_${troopKey}_expedition`,levelId:"4"}] } // 4->5 needs "Stage 1 Lv.4"
    );
    const lethality = mkCombat(`fclab_${troopKey}_lethality`, "lethality");
    const atk = mkCombat(`fclab_${troopKey}_atk`, "atk");
    const def = mkCombat(`fclab_${troopKey}_def`, "def");
    const hp = mkCombat(`fclab_${troopKey}_hp`, "hp");
    // Max Rally level requires all other stats to also be maxed out.
    const rally = fclabTrack(`fclab_${troopKey}_rally`, "rally",
      [160,200,240,290,360,430,530,650,810,1010,1260,1580],
      { 1:[
        {trackId:`fclab_${troopKey}_expedition`,levelId:"5"},
        {trackId:`fclab_${troopKey}_lethality`,levelId:"10"},
        {trackId:`fclab_${troopKey}_atk`,levelId:"10"},
        {trackId:`fclab_${troopKey}_def`,levelId:"10"},
        {trackId:`fclab_${troopKey}_hp`,levelId:"10"},
      ] }
    );
    // Unlocking T11 requires Rally Troop Capacity at max level (12).
    const bastion = fclabTrack(`fclab_${troopKey}_bastion`, "bastion",
      [4500],
      { 1:[{trackId:`fclab_${troopKey}_rally`,levelId:"12"}] }
    );
    const set = [expedition, lethality, atk, def, hp, rally, bastion];
    set.forEach(tr=>{ tr.troopKey = troopKey; tr.nameParts = ["troop_"+troopKey, "research_"+tr.statKey]; });
    return set;
  }

  const research = [
    ...fcLabTree("shieldbearer"),
    ...fcLabTree("bomber"),
    ...fcLabTree("shooter"),
  ];

  return {
    schemaVersion: SCHEMA_VERSION,
    stock: zeroResources(),
    tracks: [...buildings, ...research]
  };
}
