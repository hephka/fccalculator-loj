// Levels 0->100, in steps of 10. Each step's cost is the sum of every single
// level-up in that range plus the one-time "Breakthrough" cost paid at the
// milestone (confirmed against source table; Level 30->40's Breakthrough was
// corrected from a misread "30/0" to the verified "60/15").
const ROBOT_COSTS = [
  {lvl:"10", pad:1200,  pm:20,  apm:0},
  {lvl:"20", pad:2310,  pm:30,  apm:0},
  {lvl:"30", pad:3600,  pm:40,  apm:10},
  {lvl:"40", pad:5320,  pm:60,  apm:15},
  {lvl:"50", pad:7560,  pm:80,  apm:20},
  {lvl:"60", pad:10260, pm:100, apm:30},
  {lvl:"70", pad:19400, pm:130, apm:140},
  {lvl:"80", pad:24800, pm:160, apm:50},
  {lvl:"90", pad:30300, pm:190, apm:70},
  {lvl:"100",pad:36300, pm:230, apm:90},
];

function makeRobotTrack(idx){
  const levels = [{ id:"0", cost:zeroResources(), requires:[] }];
  ROBOT_COSTS.forEach(c=>{
    const cost = zeroResources();
    cost.PrisonerArmorData = c.pad;
    cost.PowerModule = c.pm;
    cost.AdvancedPowerModule = c.apm;
    levels.push({ id:c.lvl, cost, requires:[] });
  });
  return {
    id:`robot_${idx}`, category:"Robot", qtyIndex:idx,
    nameParts:[{key:"robotLabel", vars:{n:idx}}], levelStyle:"numeric",
    currentLevelIndex:0, targetLevelIndex:0, levels
  };
}

// Levels 0->50, in steps of 10. The 40->50 Data Disk cost isn't confirmed yet:
// R and SR satellites follow an almost identical bracket-to-bracket growth
// curve (their ratios match within 0.1% on brackets 2-4), so it's estimated
// from SR's own 40->50 growth rate applied to R's last known bracket. Its
// Planet Coin cost (80) IS confirmed, following the established sequence.
const SAT_R_COSTS = [
  {lvl:"10", dd:1565,  pc:10},
  {lvl:"20", dd:2840,  pc:20},
  {lvl:"30", dd:4730,  pc:40},
  {lvl:"40", dd:7480,  pc:60},
  {lvl:"50", dd:11230, pc:80}, // dd estimated, not confirmed — see introNote
];

// Levels 0->70, in steps of 10.
const SAT_SR_COSTS = [
  {lvl:"10", dd:1740,  pc:20},
  {lvl:"20", dd:3125,  pc:40},
  {lvl:"30", dd:5205,  pc:60},
  {lvl:"40", dd:8225,  pc:100},
  {lvl:"50", dd:12350, pc:150},
  {lvl:"60", dd:17565, pc:200},
  {lvl:"70", dd:23825, pc:260},
];

// Levels 0->90, in steps of 10 like R and SR. The source table only gave a
// per-level Data Disk breakdown, so each bracket's cost is the sum of its 10
// individual level-ups (kept below for traceability) plus that bracket's
// one-time "Breakthrough" Planet Coin cost (10, 20, ... 90).
const SSR_LEVEL_DATADISK = [
  280,120,130,145,155,165,175,185,205,225,
  240,260,275,290,310,325,340,355,380,405,
  430,450,470,495,515,540,560,580,615,655,
  685,720,750,785,820,850,885,915,960,1010,
  1055,1100,1140,1185,1230,1275,1320,1360,1415,1475,
  1530,1585,1640,1695,1750,1805,1860,1915,1985,2055,
  2120,2185,2250,2315,2380,2445,2510,2575,2640,2710,
  2745,2780,2815,2850,2885,2920,2955,2990,3025,3060,
  3105,3145,3185,3225,3265,3305,3345,3385,3425,3470,
];
const SSR_BREAKTHROUGH_PLANETCOIN = {10:30,20:60,30:100,40:150,50:210,60:280,70:360,80:450,90:500};
const SAT_SSR_COSTS = Object.keys(SSR_BREAKTHROUGH_PLANETCOIN).map(lvl=>{
  const bracketStart = Number(lvl) - 10;
  const dd = SSR_LEVEL_DATADISK.slice(bracketStart, bracketStart+10).reduce((a,b)=>a+b, 0);
  return { lvl, dd, pc: SSR_BREAKTHROUGH_PLANETCOIN[lvl] };
});

// Unlike Robots, each Satellite is a specific named unit (not "however many
// you own"), so every satellite gets its own fixed track instead of a
// dynamic add-up-to-N list.
function makeSatelliteTrack(id, category, nameKey, costs){
  const levels = [{ id:"0", cost:zeroResources(), requires:[] }];
  costs.forEach(c=>{
    const cost = zeroResources();
    cost.DataDisk = c.dd;
    cost.PlanetCoin = c.pc;
    levels.push({ id:c.lvl, cost, requires:[] });
  });
  return {
    id, category,
    nameParts:[nameKey], levelStyle:"numeric",
    currentLevelIndex:0, targetLevelIndex:0, levels
  };
}

function defaultData(){
  return {
    schemaVersion: SCHEMA_VERSION,
    stock: zeroResources(),
    counts: { Robot:1 },
    tracks: [
      makeRobotTrack(1),
      makeSatelliteTrack("sat_r_laser", "SatelliteR", "sat_r_laser", SAT_R_COSTS),
      makeSatelliteTrack("sat_r_observateur", "SatelliteR", "sat_r_observateur", SAT_R_COSTS),
      makeSatelliteTrack("sat_r_radiance", "SatelliteR", "sat_r_radiance", SAT_R_COSTS),
      makeSatelliteTrack("sat_sr_arbitre", "SatelliteSR", "sat_sr_arbitre", SAT_SR_COSTS),
      makeSatelliteTrack("sat_sr_sentinelle", "SatelliteSR", "sat_sr_sentinelle", SAT_SR_COSTS),
      makeSatelliteTrack("sat_ssr_domaine_omniscient", "SatelliteSSR", "sat_ssr_domaine_omniscient", SAT_SSR_COSTS),
      makeSatelliteTrack("sat_ssr_nexus_celeste", "SatelliteSSR", "sat_ssr_nexus_celeste", SAT_SSR_COSTS),
      makeSatelliteTrack("sat_ssr_argus", "SatelliteSSR", "sat_ssr_argus", SAT_SSR_COSTS),
      makeSatelliteTrack("sat_ssr_polaris", "SatelliteSSR", "sat_ssr_polaris", SAT_SSR_COSTS),
    ]
  };
}

function summaryResourceKeys(totals){
  return RESOURCES.filter(resource => totals[resource] > 0);
}
