<script>

const CATEGORIES = [
  { key:"Tome", labelKey:"catTome", icon:"📖", grouped:false, dynamic:{addLabelKey:"addTome", makeTrack:makeTomeTrack, max:18} },
  { key:"Collection", labelKey:"catCollection", icon:"🏺", grouped:false, dynamic:{addLabelKey:"addCollection", makeTrack:makeCollectionTrack, max:6} },

  },
};

// Levels 0->12: cost jump for that single step, in {SealOfWisdom, SealOfKnowledge}.
// Identical for every tome (confirmed against source table).
const TOME_COSTS = [
  {w:10,k:10},{w:50,k:60},{w:90,k:110},{w:160,k:200},{w:270,k:330},
  {w:380,k:460},{w:480,k:600},{w:540,k:660},{w:620,k:780},{w:760,k:920},
  {w:920,k:1040},{w:1040,k:1240},
];

function makeTomeTrack(idx){
  const levels = [{ id:"0", cost:zeroResources(), requires:[] }];
  TOME_COSTS.forEach((c,i)=>{
    const cost = zeroResources();
    cost.SealOfWisdom = c.w;
    cost.SealOfKnowledge = c.k;
    levels.push({ id:String(i+1), cost, requires:[] });
  });
  return {
    id:`tome_${idx}`, category:"Tome", qtyIndex:idx,
    nameParts:[{key:"tomeLabel", vars:{n:idx}}], levelStyle:"numeric", romanLevels:true,
    currentLevelIndex:0, targetLevelIndex:0, levels
  };
}

// One collection item's sequence: each tier has a base level plus up to 3
// "star" sub-levels (Uncommon only goes to 1 star; every tier after has 3).
// Costs are {Common, Rare, Precious, Legendary} Trove Souvenir Coin.
const COLLECTION_TIERS = [
  { key:"uncommon", levels:[
    {c:3000,r:30}, {c:7500,r:75},
  ]},
  { key:"rare", levels:[
    {c:13500,r:135}, {c:20000,r:200}, {c:5000,r:50,p:70}, {c:6000,r:60,p:80},
  ]},
  { key:"epic", levels:[
    {c:7000,r:70,p:90}, {c:8000,r:80,p:100}, {c:9000,r:90,p:110}, {c:10000,r:100,p:120},
  ]},
  { key:"epic_t1", levels:[
    {c:15000,r:150,p:140}, {c:20000,r:200,p:150}, {c:25000,r:250,p:170}, {c:30000,r:300,p:210},
  ]},
  { key:"legendary", levels:[
    {c:41000,r:410,p:90}, {c:43000,r:430,p:90}, {c:47000,r:470,p:100}, {c:49000,r:490,p:100},
  ]},
  { key:"legendary_t1", levels:[
    {c:53000,r:530,p:100}, {c:57000,r:570,p:120}, {c:61000,r:610,p:120}, {c:66000,r:660,p:120},
  ]},
  { key:"legendary_t2", levels:[
    {c:71000,r:710,p:120}, {c:83000,r:830,p:160}, {c:88000,r:880,p:170}, {c:95000,r:950,p:180},
  ]},
  { key:"exotic", levels:[
    {c:100000,r:1000,p:180,l:15}, {c:105000,r:1050,p:190,l:20}, {c:110000,r:1100,p:200,l:20}, {c:115000,r:1150,p:210,l:25},
  ]},
  { key:"exotic_t1", levels:[
    {c:120000,r:1200,p:245,l:25}, {c:125000,r:1250,p:255,l:30}, {c:130000,r:1300,p:265,l:30}, {c:135000,r:1350,p:275,l:35},
  ]},
  { key:"exotic_t2", levels:[
    {c:140000,r:1400,p:310,l:35}, {c:145000,r:1450,p:315,l:40}, {c:150000,r:1500,p:325,l:40}, {c:160000,r:1600,p:335,l:45},
  ]},
  { key:"exotic_t3", levels:[
    {c:165000,r:1650,p:350,l:45}, {c:170000,r:1700,p:365,l:50}, {c:175000,r:1750,p:385,l:50}, {c:180000,r:1800,p:410,l:55},
  ]},
];

function makeCollectionTrack(idx){
  const levels = [{ id:"start", cost:zeroResources(), requires:[] }];
  COLLECTION_TIERS.forEach(tier=>{
    tier.levels.forEach((lv,i)=>{
      const cost = zeroResources();
      cost.CommonCoin = lv.c||0; cost.RareCoin = lv.r||0; cost.PreciousCoin = lv.p||0; cost.LegendaryCoin = lv.l||0;
      const id = i===0 ? tier.key : `${tier.key}_s${i}`;
      levels.push({ id, cost, requires:[] });
    });
  });
  return {
    id:`collection_${idx}`, category:"Collection", qtyIndex:idx,
    nameParts:[{key:"collectionLabel", vars:{n:idx}}],
    levelStyle:"keyed", levelKeyPrefix:"coltier_", stageWordKey:"starWord",
    currentLevelIndex:0, targetLevelIndex:0, levels
  };
}

function defaultData(){
  return {
    schemaVersion: SCHEMA_VERSION,
    stock: zeroResources(),
    counts: { Tome:1, Collection:1 },
    tracks: [makeTomeTrack(1), makeCollectionTrack(1)]
  };
}

function summaryResourceKeys(totals){
  return RESOURCES.filter(resource => totals[resource] > 0);
}
</script>
