<script>
const RESOURCES = ["HeroFragment","ExclusiveEquipPart"];
const STORAGE_KEY = "resource-calc-herostars-state-v1";
const SCHEMA_VERSION = 3;
const RES_ACCENT = {
  HeroFragment:"#ffd60a", ExclusiveEquipPart:"#ffd60a",
};
const PARTS = [
  { key:"stars", labelKey:"partStars", icon:"⭐" },
  { key:"equipment", labelKey:"partEquipment", icon:"⚔️" },
];
// Each "+ Add Hero" button is independent (its own counter, no countKey) —
// you can track more heroes for Stars than for Exclusive Equipment, or the
// other way around.
const CATEGORIES = [
  { key:"HeroStar", labelKey:"catHeroStar", icon:"⭐", grouped:false, part:"stars",
    dynamic:{addLabelKey:"addHero", makeTrack:makeHeroStarTrack, max:6} },
  { key:"ExclusiveEquip", labelKey:"catExclusiveEquip", icon:"⚔️", grouped:false, part:"equipment",
    dynamic:{addLabelKey:"addHero", makeTrack:makeExclusiveEquipTrack, max:6} },
];

const I18N = {
  en: {
    title: "Hero Stars & Exclusive Equipment - Lands of Jail",
    pageTitle: "Hero Stars & Exclusive Equipment",
    subtitle: "Recruit and star up your heroes, and upgrade their exclusive equipment.",
    introLead: "Plan your heroes' star and exclusive equipment upgrades.",
    introFeature1: "Track each hero individually, then set its current level and target",
    introFeature2: "Prerequisites are resolved automatically — no manual math",
    introNote: "Cost is identical across all heroes. \"Current\" breaks each star down stage by stage to track progress already in motion; \"Target\" only offers whole completed stars. The two add buttons are independent.",
    noTargetHint: "No target set yet — pick a target level on a hero below.",
    partStars: "Hero Stars", partEquipment: "Exclusive Equipment",
    catHeroStar: "Hero Stars", catExclusiveEquip: "Exclusive Equipment",
    res_HeroFragment: "Redeem", res_ExclusiveEquipPart: "Exclusive Weapon Parts",
    addHero: "+ Add Hero",
    heroLabel: "Hero {n}",
    herostartier_start: "Not recruited",
    herostartier_recruited: "Recruited (0 stars)",
    herostartier_star1: "1 star", herostartier_star2: "2 stars", herostartier_star3: "3 stars",
    herostartier_star4: "4 stars", herostartier_star5: "5 stars",
  },
  fr: {
    title: "Étoiles de Héros & Équipement Exclusif - Lands of Jail",
    pageTitle: "Étoiles de Héros & Équipement Exclusif",
    subtitle: "Recrute et fais monter en étoiles tes héros, et améliore leur équipement exclusif.",
    introLead: "Planifie les améliorations d'étoiles et d'équipement exclusif de tes héros.",
    introFeature1: "Suis chaque héros individuellement, puis fixe son niveau actuel et sa cible",
    introFeature2: "Les prérequis sont résolus automatiquement — plus de calcul à la main",
    introNote: "Le coût est identique pour tous les héros. « Actuel » détaille chaque étoile palier par palier pour suivre une progression déjà en cours ; « Cible » ne propose que des étoiles complètes. Les deux boutons d'ajout sont indépendants.",
    noTargetHint: "Aucun objectif défini pour l'instant — choisis un niveau cible sur un héros ci-dessous.",
    partStars: "Étoiles de Héros", partEquipment: "Équipement Exclusif",
    catHeroStar: "Étoiles de Héros", catExclusiveEquip: "Équipement Exclusif",
    res_HeroFragment: "Fragment de héros", res_ExclusiveEquipPart: "Pièce d'équipement exclusif",
    addHero: "+ Ajouter un Héros",
    heroLabel: "Héros {n}",
    herostartier_start: "Non recruté",
    herostartier_recruited: "Recruté (0 étoile)",
    herostartier_star1: "1 étoile", herostartier_star2: "2 étoiles", herostartier_star3: "3 étoiles",
    herostartier_star4: "4 étoiles", herostartier_star5: "5 étoiles",
  },
};

// Recruiting (10 Fragments) unlocks the hero at 0 stars. Each star (1-5) has
// 6 internal paliers — the first 5 are kept as fine-grained, "Actuel"-only
// levels (a real hero's progress may already be mid-star before a target is
// even set), and the 6th is that star's own completion, which doubles as
// the only checkpoint offered in "Cible" (targets are always a whole star).
// Per-star totals match the source guide exactly:
//   Star 1: 1+1+2+2+2+2  = 10   Star 4: 40x5+100      = 300
//   Star 2: 5x5+15       = 40   Star 5: 100x6          = 600
//   Star 3: 15x5+40      = 115
const HERO_STAR_TIERS = [
  { key:"star1", paliers:[1,1,2,2,2],     final:2 },
  { key:"star2", paliers:[5,5,5,5,5],     final:15 },
  { key:"star3", paliers:[15,15,15,15,15], final:40 },
  { key:"star4", paliers:[40,40,40,40,40], final:100 },
  { key:"star5", paliers:[100,100,100,100,100], final:100 },
];

function makeHeroStarTrack(idx){
  // "Non recruté" is a checkpoint, not a palier. It's where every track starts
  // and what targetLevelIndex holds while no goal is set, so it has to be
  // selectable as a target like every other track's level 0 — marking it
  // targetCheckpoint:false took it out of the "Cible" list, and adoptProgress
  // then snapped a saved target of 0 up to `recruited` on load, inventing a
  // 10-fragment goal per hero that nobody asked for and writing it back.
  const levels = [{ id:"start", cost:zeroResources(), requires:[] }];
  const recruitCost = zeroResources();
  recruitCost.HeroFragment = 10;
  levels.push({ id:"recruited", cost:recruitCost, requires:[] });
  HERO_STAR_TIERS.forEach((tier,tierIdx)=>{
    // A palier is named after the star you already hold, never the one you're
    // climbing toward — same rule as a building's "FC3 · palier 2", which means
    // FC3 plus two steps. These five sit between the previous checkpoint and
    // this tier's own star, so they carry the previous checkpoint's name: a
    // player three paliers past their first star reads "1 étoile · palier 3",
    // not "2 étoiles · palier 3", which invited them to think they had two.
    const heldKey = tierIdx === 0 ? "recruited" : HERO_STAR_TIERS[tierIdx-1].key;
    tier.paliers.forEach((fragments,i)=>{
      const cost = zeroResources();
      cost.HeroFragment = fragments;
      levels.push({ id:`${heldKey}_s${i+1}`, cost, requires:[], targetCheckpoint:false });
    });
    const finalCost = zeroResources();
    finalCost.HeroFragment = tier.final;
    // "2★" instead of "2 étoiles" at the end of the paliers bar. The full label
    // is 76px against "▸ FC1"'s 35, and every pixel it takes comes straight out
    // of six tap targets: 34.7px each with the long form, 42.7px with this one,
    // measured at 375px. It stays out of I18N on purpose — a digit and a star
    // read the same in every language, and the segments' aria-labels still
    // carry the full wording for anyone not reading the shape.
    levels.push({ id:tier.key, cost:finalCost, requires:[], barLabel:`${tierIdx+1}★` });
  });
  return {
    id:`herostar_${idx}`, category:"HeroStar", qtyIndex:idx,
    nameParts:[{key:"heroLabel", vars:{n:idx}}],
    levelStyle:"keyed", levelKeyPrefix:"herostartier_",
    // Same case as a building's FC tiers: the 5 paliers between two stars are
    // fractional progress toward the next one, not goals of their own, so
    // "Actuel" becomes a 7-entry tier select plus a bar instead of a 32-entry
    // list. Six segments here rather than the buildings' five, since the star
    // itself is the sixth step.
    paliersBar: true,
    currentLevelIndex:0, targetLevelIndex:0, levels
  };
}

// Levels 0->10, one by one (confirmed source table, no discrepancies).
const EXCLUSIVE_EQUIP_COSTS = [10,25,25,45,45,65,65,85,85,100];

function makeExclusiveEquipTrack(idx){
  const levels = [{ id:"0", cost:zeroResources(), requires:[] }];
  EXCLUSIVE_EQUIP_COSTS.forEach((partsCost,i)=>{
    const cost = zeroResources();
    cost.ExclusiveEquipPart = partsCost;
    levels.push({ id:String(i+1), cost, requires:[] });
  });
  return {
    id:`exclusiveequip_${idx}`, category:"ExclusiveEquip", qtyIndex:idx,
    nameParts:[{key:"heroLabel", vars:{n:idx}}], levelStyle:"numeric",
    currentLevelIndex:0, targetLevelIndex:0, levels
  };
}

function defaultData(){
  return {
    schemaVersion: SCHEMA_VERSION,
    stock: zeroResources(),
    // One counter per category, keyed exactly as each category counts itself
    // (neither declares a dynamic.countKey, so the key is the category key).
    // A single "Hero" counter here instead meant both real counters started
    // undefined while defaultData had already built one track each, so the
    // first "+ Add Hero" click only caught the counter up to what was on
    // screen and appeared to do nothing.
    counts: { HeroStar:1, ExclusiveEquip:1 },
    tracks: [makeHeroStarTrack(1), makeExclusiveEquipTrack(1)]
  };
}

// Schema 2 -> 3 clears the phantom target the old "Non recruté isn't a
// checkpoint" bug left behind: adoptProgress snapped a saved target of 0 up to
// `recruited` and wrote it back, so a returning visitor was quoted 10 Hero
// Fragments per hero for a goal they never set — and couldn't clear it, since
// "Non recruté" wasn't in the "Cible" list to pick.
//
// Deliberately narrow: only a hero still at "Non recruté" whose target is
// exactly `recruited`, which is the signature the bug produced. A hero sitting
// at "Non recruté" with a target of, say, 3 stars is someone's real plan for a
// hero they haven't started, and wiping that would be the data loss this is
// supposed to undo. Level indices are unchanged between 2 and 3, so everything
// else — stock, hero counts, the other tracks — passes through untouched and
// adoptProgress rebuilds from defaultData() as usual.
function migrateState(old){
  if(old.schemaVersion !== 2 || !Array.isArray(old.tracks)) return null;
  return Object.assign({}, old, {
    schemaVersion: SCHEMA_VERSION,
    tracks: old.tracks.map(tr=>{
      if(!tr || typeof tr.id !== "string") return tr;
      const phantom = tr.id.indexOf("herostar_") === 0
        && Number(tr.currentLevelIndex) === 0
        && Number(tr.targetLevelIndex) === 1;
      return phantom ? Object.assign({}, tr, { targetLevelIndex: 0 }) : tr;
    }),
  });
}
</script>
