// Levels 0->200. Common through Legendary (0-100) use 4-6 small brackets per
// rarity, each ending in a one-time Magnet cost when the rarity completes.
// Legendary T1+ (100-200) use single big brackets (confirmed source table).
// Common's 0->10 Equipment Parts cost isn't in the source (only 11-15 and
// 16-20 were given) — estimated (~970) by fitting a geometric growth curve
// to the 6 known Common/Uncommon brackets (fits within 5% on every point)
// and extrapolating backward. Flagged in introNote, not verified in-game.
const EQUIPMENT_COSTS = [
  {lvl:"10",  parts:970},
  {lvl:"15",  parts:700},
  {lvl:"20",  parts:950,   magnet:20},
  {lvl:"25",  parts:1200},
  {lvl:"30",  parts:1460},
  {lvl:"35",  parts:1900},
  {lvl:"40",  parts:2420,  magnet:40},
  {lvl:"45",  parts:3300},
  {lvl:"50",  parts:4300},
  {lvl:"55",  parts:5300},
  {lvl:"60",  parts:6320,  magnet:120},
  {lvl:"65",  parts:7700},
  {lvl:"70",  parts:9220},
  {lvl:"75",  parts:11100},
  {lvl:"80",  parts:13000, magnet:200},
  {lvl:"85",  parts:15500},
  {lvl:"90",  parts:18000},
  {lvl:"95",  parts:20500},
  {lvl:"100", parts:23000, magnet:400},
  {lvl:"120", parts:117000, magnet:600,  coil:20,  gate:true},
  {lvl:"140", parts:157000, magnet:1000, coil:40},
  {lvl:"160", parts:197000, magnet:1000, coil:60},
  {lvl:"180", parts:258000, magnet:2000, coil:80},
  {lvl:"200", parts:338200, magnet:2000, coil:100},
];

function makeEquipmentTrack(troopKey, slotKey){
  const levels = [{ id:"0", cost:zeroResources(), requires:[] }];
  EQUIPMENT_COSTS.forEach(c=>{
    const cost = zeroResources();
    cost.EquipmentParts = c.parts;
    cost.Magnet = c.magnet || 0;
    cost.PotentialCoil = c.coil || 0;
    // Promoting past Legendary (Level 100) to Legendary T2 requires this same
    // piece's own Reformation track to already be at Level 10.
    const requires = c.gate ? [{trackId:`reform_${troopKey}_${slotKey}`, levelId:"10"}] : [];
    levels.push({ id:c.lvl, cost, requires });
  });
  return {
    id:`equip_${troopKey}_${slotKey}`, category:"Equipment", troopKey,
    nameParts:["troop_"+troopKey, "equip_"+slotKey], levelStyle:"numeric",
    currentLevelIndex:0, targetLevelIndex:0, levels
  };
}

// Levels 0->20, one by one (source table gives per-level Precision Equipment
// cost; Magnet is only spent from Level 10 onward). Kept exactly as given,
// including its minor non-linear jumps — they're small and at low levels.
const REFORMATION_PRECISION = [
  20,40,60,80,100,120,140,160,180,200,
  220,240,260,280,300,320,360,380,400,400,
];
const REFORMATION_MAGNET = {10:220,11:200,12:400,13:600,14:800,15:1000,16:1200,17:1400,18:1600,19:1800,20:2000};

function makeReformationTrack(troopKey, slotKey){
  const levels = [{ id:"0", cost:zeroResources(), requires:[] }];
  REFORMATION_PRECISION.forEach((precision,i)=>{
    const lvl = i+1;
    const cost = zeroResources();
    cost.PrecisionEquipment = precision;
    cost.Magnet = REFORMATION_MAGNET[lvl] || 0;
    levels.push({ id:String(lvl), cost, requires:[] });
  });
  return {
    id:`reform_${troopKey}_${slotKey}`, category:"Reformation", troopKey,
    nameParts:["troop_"+troopKey, "reformslot_"+slotKey], levelStyle:"numeric",
    currentLevelIndex:0, targetLevelIndex:0, levels
  };
}

const TROOPS = ["shieldbearer","bomber","shooter"];
const SLOTS = ["gloves","helmet","chest","boots"];

function defaultData(){
  const equipment = [];
  const reformation = [];
  TROOPS.forEach(troop=>{
    SLOTS.forEach(slot=>{
      equipment.push(makeEquipmentTrack(troop, slot));
      reformation.push(makeReformationTrack(troop, slot));
    });
  });
  return {
    schemaVersion: SCHEMA_VERSION,
    stock: zeroResources(),
    tracks: [...equipment, ...reformation]
  };
}
